<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Reveal Wallpaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts are loaded dynamically -->
  <script src="assets/data/config.js"></script>
  <style>
    :root {
      --primary: #F4C430;
      --secondary: #ff5a6e;
      --logo-color: #F7D446;
      --logo-stroke: 3px #0a1a3a;
      --title-shadow: 3px 3px 0 #b3001a, 0 0 14px rgba(192, 0, 26, 0.5), 0 0 36px rgba(192, 0, 26, 0.3);
      --right-title-shadow: 3px 3px 0 #6a3fb3, 0 0 16px rgba(180, 120, 255, 0.5), 0 0 40px rgba(180, 120, 255, 0.3);
      --font-logo: 'Luckiest Guy', cursive;
      --font-title: 'Bangers', cursive;
      --font-eyebrow: 'Bebas Neue', sans-serif;
      --font-desc: 'Cormorant Garamond', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      background: #04060c;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: none;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 20;
      background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), var(--primary), transparent);
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .content {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .logo {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 960px);
      min-width: 0;
      z-index: 15;
      text-align: center;
      pointer-events: none;
    }

    .logo .op {
      font-family: var(--font-logo);
      font-size: clamp(40px, 4vw, 64px);
      line-height: 0.9;
      letter-spacing: 0.02em;
      color: var(--logo-color);
      -webkit-text-stroke: var(--logo-stroke);
      text-shadow:
        0 4px 0 #b3001a,
        0 6px 0 #0a1a3a,
        0 0 24px rgba(244, 196, 48, 0.45);
    }

    .logo .tag {
      margin-top: 2px;
      font-family: var(--font-eyebrow);
      font-size: 15px;
      letter-spacing: clamp(0.15em, 0.35vw, 0.5em);
      color: #fff;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      padding-left: 0.5em;
    }

    .left {
      position: absolute;
      bottom: 64px;
      left: 64px;
      width: 360px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .right {
      position: absolute;
      top: 54%;
      right: 64px;
      transform: translateY(-50%);
      width: 380px;
      min-width: 0;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-end;
    }

    .eyebrow {
      font-family: var(--font-eyebrow);
      font-size: 15px;
      letter-spacing: 0.35em;
      color: var(--primary);
      padding-left: 1.4rem;
      position: relative;
    }

    .eyebrow::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1rem;
      height: 1.5px;
      background: var(--primary);
    }

    .right .eyebrow {
      color: var(--secondary);
      padding: 0 1.4rem 0 0;
    }

    .right .eyebrow::before {
      left: auto;
      right: 0;
      background: var(--secondary);
    }

    .title {
      font-family: var(--font-title);
      font-size: clamp(44px, 5vw, 78px);
      line-height: 0.92;
      color: #fff;
      letter-spacing: 0.02em;
      text-shadow: var(--title-shadow);
    }

    .right .title {
      font-size: clamp(38px, 4vw, 62px);
      color: #fff;
      text-shadow: var(--right-title-shadow);
    }

    .desc {
      font-family: var(--font-desc);
      font-style: italic;
      font-size: 19px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.82);
    }

    .btn {
      font-family: var(--font-eyebrow);
      font-size: 17px;
      letter-spacing: 0.2em;
      padding: 14px 28px;
      background: transparent;
      color: #fff;
      border: 2px solid var(--primary);
      cursor: pointer;
      align-self: flex-start;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
      pointer-events: all;
      transition: border-color .3s, color .3s;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--primary);
      transform: translateX(-105%) skewX(-8deg);
      transition: transform .38s cubic-bezier(.4, 0, .2, 1);
      z-index: -1;
    }

    .btn:hover {
      border-color: #ffe066;
      color: #1a0a00;
    }

    .btn:hover::after {
      transform: translateX(0) skewX(-8deg);
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 16;
      font-family: var(--font-eyebrow);
      letter-spacing: 0.25em;
      font-size: 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 18px;
      border-radius: 999px;
      max-width: calc(100vw - 40px);
      text-align: center;
      pointer-events: none;
      transition: opacity .5s;
    }

    .logo .op,
    .logo .tag,
    .eyebrow,
    .title,
    .desc,
    .btn,
    .hint {
      min-width: 0;
      max-width: 100%;
      white-space: pre-line;
      overflow-wrap: anywhere;
      word-break: normal;
      hyphens: auto;
      unicode-bidi: plaintext;
    }

    .content, .logo, .hint {
      transition: opacity 0.4s ease;
    }
    body.ui-hidden .content,
    body.ui-hidden .logo,
    body.ui-hidden .hint {
      opacity: 0 !important;
      pointer-events: none;
    }

    .hero[data-theme="aeren-sol"] .logo {
      top: 38px;
      left: 54px;
      width: min(560px, calc(100vw - 108px));
      transform: none;
      text-align: left;
    }

    .hero[data-theme="aeren-sol"] .logo .op {
      font-size: clamp(38px, 3.6vw, 60px);
      letter-spacing: 0.08em;
      text-shadow: 0 0 22px rgba(82, 208, 211, 0.22);
    }

    .hero[data-theme="aeren-sol"] .logo .tag {
      padding-left: 0;
      letter-spacing: clamp(0.12em, 0.26vw, 0.34em);
    }

    .hero[data-theme="aeren-sol"] .left {
      left: 54px;
      bottom: 58px;
      width: min(390px, calc(48vw - 70px));
    }

    .hero[data-theme="aeren-sol"] .right {
      top: 190px;
      right: auto;
      left: 54px;
      width: min(350px, calc(45vw - 70px));
      transform: none;
      text-align: left;
      align-items: flex-start;
    }

    .hero[data-theme="aeren-sol"] .right .eyebrow {
      padding: 0 0 0 1.4rem;
    }

    .hero[data-theme="aeren-sol"] .right .eyebrow::before {
      right: auto;
      left: 0;
    }

    .hero[data-theme="aeren-sol"] .title,
    .hero[data-theme="aeren-sol"] .right .title {
      font-size: clamp(36px, 3.8vw, 60px);
      letter-spacing: 0.045em;
    }

    @media (max-width:680px) {
      .logo .op {
        font-size: 38px;
      }

      .logo .tag {
        font-size: 11px;
        letter-spacing: 0.3em;
      }

      .left {
        left: 22px;
        bottom: 34px;
        width: 62%;
      }

      .right {
        right: 22px;
        width: 58%;
      }

      .title {
        font-size: 42px;
      }

      .right .title {
        font-size: 34px;
      }

      .desc {
        font-size: 15px;
      }

      .btn {
        font-size: 14px;
        padding: 11px 18px;
      }

      .hero[data-theme="aeren-sol"] .logo {
        top: 24px;
        left: 22px;
        width: calc(100vw - 44px);
      }

      .hero[data-theme="aeren-sol"] .right {
        top: 142px;
        right: auto;
        left: 22px;
        width: 62%;
      }

      .hero[data-theme="aeren-sol"] .left {
        left: 22px;
        bottom: 34px;
        width: 62%;
      }
    }
  </style>
</head>

<body>
  <div class="hero" id="hero">
    <canvas class="hero-canvas" id="cv"></canvas>

    <div class="logo">
      <div class="op" id="ui-logoText"></div>
      <div class="tag" id="ui-logoSubText"></div>
    </div>

    <div class="content">
      <div class="left">
        <span class="eyebrow" id="ui-leftEyebrow"></span>
        <h1 class="title" id="ui-leftTitle"></h1>
        <p class="desc" id="ui-leftDesc"></p>
        <button class="btn" id="ui-buttonText" type="button"></button>
      </div>
      <div class="right">
        <span class="eyebrow" id="ui-rightEyebrow"></span>
        <h1 class="title" id="ui-rightTitle"></h1>
        <p class="desc" id="ui-rightDesc"></p>
      </div>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <script>
    (function () {
      // --- DOM Elements ---
      const hero = document.getElementById('hero');
      const canvas = document.getElementById('cv');
      // Lively's Chromium host can tear when `desynchronized` canvas rendering
      // is combined with a second compositing canvas. Use the stable path.
      const ctx = canvas.getContext('2d');
      const hint = document.getElementById('hint');
      const contentNodes = {
        logoText: document.getElementById('ui-logoText'),
        logoSubText: document.getElementById('ui-logoSubText'),
        leftEyebrow: document.getElementById('ui-leftEyebrow'),
        leftTitle: document.getElementById('ui-leftTitle'),
        leftDesc: document.getElementById('ui-leftDesc'),
        buttonText: document.getElementById('ui-buttonText'),
        rightEyebrow: document.getElementById('ui-rightEyebrow'),
        rightTitle: document.getElementById('ui-rightTitle'),
        rightDesc: document.getElementById('ui-rightDesc'),
        hintText: hint,
      };
      for (const node of Object.values(contentNodes)) node.dir = 'auto';

      // --- Constants ---
      let HEAD_RADIUS = 190;
      const MAX_RENDER_PIXELS = APP_CONFIG.settings?.maxRenderPixels || 2560 * 1440;
      const SETTINGS_SCHEMA_VERSION = 2;
      const SETTINGS_STORAGE_KEY = 'interactive-wallpaper-settings-v2';
      const LEGACY_SETTINGS_STORAGE_KEY = 'interactive-wallpaper-settings-v1';
      const TEXT_FIELD_DEFINITIONS = APP_CONFIG.controls?.textFields || {};
      const LIVELY_TEXT_PROPERTIES = Object.fromEntries(
        Object.entries(TEXT_FIELD_DEFINITIONS)
          .filter(([, definition]) => typeof definition?.propertyName === 'string')
          .map(([fieldId, definition]) => [definition.propertyName, fieldId]),
      );
      const runtimeThemes = APP_CONFIG.themes.filter(theme =>
        theme.enabled !== false || (
          APP_CONFIG.build?.mode === 'development' &&
          APP_CONFIG.build?.platform === 'browser' &&
          theme.developmentPreview === true
        )
      );

      if (!runtimeThemes.length) {
        throw new Error('No enabled wallpaper themes are configured.');
      }

      // --- State ---
      const mouse = { x: 0, y: 0 };
      const smooth = { x: 0, y: 0 };
      let trail = [];
      let isPaused = false;
      let animFrameId = null;
      let renderScale = 1;
      let lastFrameTime = 0;
      let pointerInitialized = false;
      let pointerActive = false;
      let headLastActive = 0;
      let activeTheme = runtimeThemes[0];
      let activeTrailId = activeTheme.settings.defaults.trailId;
      let activeSettings = {};
      let trailHeadScale = 1;
      let targetTrailHeadScale = 1;
      let nextTrailPointId = 0;
      let persistTextTimer = null;
      let pendingTextPersistence = null;
      let motionPreviewEnabled = true;
      const livingMotionState = {
        offsetX: 0,
        offsetY: 0,
        flowX: 0,
        flowY: 0,
        previousPointerX: 0,
        previousPointerY: 0,
        pointerReady: false,
      };
      let livingPetalParticles = [];
      let livingMoteParticles = [];
      let livingConstellationLinks = [];
      let livingMistLayers = [];
      const livingRegionBounds = new WeakMap();
      const livingRegionMeshes = new WeakMap();

      // --- Images ---
      const bottom = new Image(); // mask reveal
      const top = new Image(); // background
      let imageLoadGeneration = 0;
      let imagesReady = false;

      // --- Apply Theme from Config ---
      function getThemeById(themeId) {
        return runtimeThemes.find(theme => theme.id === themeId) || runtimeThemes[0];
      }

      function getThemeTrails(theme) {
        return Array.isArray(theme?.trails) ? theme.trails : [];
      }

      function getTrailOptions(themeId) {
        return getThemeTrails(getThemeById(themeId)).map(trailDefinition => trailDefinition.id);
      }

      function getTrailDefinition(theme, trailId) {
        return getThemeTrails(theme).find(trailDefinition => trailDefinition.id === trailId)
          || getThemeTrails(theme)[0];
      }

      function getActiveTrailDefinition() {
        return getTrailDefinition(activeTheme, activeTrailId);
      }

      function getThemeInteraction(theme = activeTheme) {
        return theme.interaction;
      }

      function getThemeCapabilities(theme) {
        return new Set(theme.settings?.capabilities || []);
      }

      function getThemeTextFields(theme) {
        const fields = Array.isArray(theme.settings?.textFields) ? theme.settings.textFields : [];
        return fields.filter(fieldId => Object.hasOwn(TEXT_FIELD_DEFINITIONS, fieldId));
      }

      function limitCodePoints(value, maximumLength) {
        return Array.from(value).slice(0, maximumLength).join('');
      }

      function normalizeTextValue(value, definition, options = {}) {
        if (typeof value !== 'string') return '';
        let normalized = value.replace(/\r\n?/g, '\n');
        if (options.decodeEscapedNewlines && definition.multiline) {
          normalized = normalized.replace(/\\n/g, '\n');
        }
        normalized = normalized
          .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
          .replace(/\t/g, ' ');

        if (!definition.multiline) {
          normalized = normalized.replace(/[ \t\r\n]+/g, ' ').trim();
        } else {
          const lines = normalized.split('\n').map(line => line.replace(/ {2,}/g, ' ').trim());
          const compactedLines = [];
          for (const line of lines) {
            const previousLine = compactedLines[compactedLines.length - 1];
            if (line || previousLine !== '') compactedLines.push(line);
          }
          while (compactedLines[0] === '') compactedLines.shift();
          while (compactedLines[compactedLines.length - 1] === '') compactedLines.pop();
          const maximumLines = Number.isInteger(definition.maxLines) ? definition.maxLines : compactedLines.length;
          normalized = compactedLines.slice(0, maximumLines).join('\n');
        }

        return limitCodePoints(normalized, definition.maxLength);
      }

      function sanitizeTextOverrides(theme, candidate = {}, options = {}) {
        const capabilities = getThemeCapabilities(theme);
        if (!capabilities.has('textCustomization') || !candidate || typeof candidate !== 'object' || Array.isArray(candidate)) {
          return {};
        }
        const overrides = {};
        for (const fieldId of getThemeTextFields(theme)) {
          if (!Object.hasOwn(candidate, fieldId)) continue;
          const definition = TEXT_FIELD_DEFINITIONS[fieldId];
          const fallback = normalizeTextValue(theme.content?.[fieldId] || '', definition);
          const normalized = normalizeTextValue(candidate[fieldId], definition, options);
          if (definition.required && !normalized) continue;
          if (normalized === fallback) continue;
          overrides[fieldId] = normalized;
        }
        return overrides;
      }

      function resolveThemeContent(theme = activeTheme, overrides = activeSettings.textOverrides || {}) {
        const resolved = {};
        for (const [fieldId, node] of Object.entries(contentNodes)) {
          void node;
          const definition = TEXT_FIELD_DEFINITIONS[fieldId];
          const fallback = definition
            ? normalizeTextValue(theme.content?.[fieldId] || '', definition)
            : String(theme.content?.[fieldId] || '');
          resolved[fieldId] = Object.hasOwn(overrides, fieldId) ? overrides[fieldId] : fallback;
        }
        return resolved;
      }

      function renderThemeContent() {
        const resolved = resolveThemeContent();
        for (const [fieldId, node] of Object.entries(contentNodes)) {
          const value = resolved[fieldId] || '';
          node.textContent = value;
          node.hidden = value.length === 0;
        }
      }

      function clampControlValue(controlName, value, fallback) {
        const definition = APP_CONFIG.controls?.[controlName];
        const numericValue = Number(value);
        if (!definition || !Number.isFinite(numericValue)) return fallback;
        return Math.min(definition.max, Math.max(definition.min, numericValue));
      }

      function sanitizeThemeSettings(theme, candidate = {}) {
        const defaults = theme.settings?.defaults || {};
        const capabilities = getThemeCapabilities(theme);
        const trailOptions = getTrailOptions(theme.id);
        const fallbackTrailId = trailOptions.includes(defaults.trailId)
          ? defaults.trailId
          : trailOptions[0];
        const settings = {
          trailId: trailOptions.includes(candidate.trailId) ? candidate.trailId : fallbackTrailId,
          artworkMotion: capabilities.has('artworkMotion')
            ? (typeof candidate.artworkMotion === 'boolean'
              ? candidate.artworkMotion
              : defaults.artworkMotion !== false)
            : false,
          showUi: capabilities.has('uiVisibility')
            ? (typeof candidate.showUi === 'boolean' ? candidate.showUi : defaults.showUi !== false)
            : true,
          showSettingsButton: capabilities.has('settingsButtonVisibility')
            ? (typeof candidate.showSettingsButton === 'boolean'
              ? candidate.showSettingsButton
              : defaults.showSettingsButton !== false)
            : false,
          textOverrides: capabilities.has('textCustomization')
            ? sanitizeTextOverrides(theme, candidate.textOverrides || {})
            : {},
        };

        for (const controlName of ['headSize', 'trailPersistence', 'effectIntensity', 'glowStrength', 'backgroundDimming']) {
          const fallback = Number(defaults[controlName]);
          settings[controlName] = capabilities.has(controlName)
            ? clampControlValue(controlName, candidate[controlName], fallback)
            : fallback;
        }

        const performanceOptions = APP_CONFIG.controls?.performanceMode?.options || ['balanced'];
        const requestedPerformance = candidate.performanceMode || defaults.performanceMode;
        settings.performanceMode = capabilities.has('performanceMode') && performanceOptions.includes(requestedPerformance)
          ? requestedPerformance
          : (performanceOptions.includes(defaults.performanceMode) ? defaults.performanceMode : performanceOptions[0]);
        return settings;
      }

      function createEmptyStoredSettings() {
        return { schemaVersion: SETTINGS_SCHEMA_VERSION, themes: {} };
      }

      function readStorageValue(storageKey) {
        try {
          const rawValue = localStorage.getItem(storageKey);
          if (!rawValue) return null;
          const parsed = JSON.parse(rawValue);
          return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : null;
        } catch (error) {
          return null;
        }
      }

      function readStoredSettings() {
        if (!APP_CONFIG.settings?.persistSettings) return createEmptyStoredSettings();
        const current = readStorageValue(SETTINGS_STORAGE_KEY);
        if (current?.schemaVersion === SETTINGS_SCHEMA_VERSION &&
          current.themes &&
          typeof current.themes === 'object' &&
          !Array.isArray(current.themes)) {
          return current;
        }
        const legacyThemes = readStorageValue(LEGACY_SETTINGS_STORAGE_KEY);
        return {
          schemaVersion: SETTINGS_SCHEMA_VERSION,
          themes: legacyThemes || {},
        };
      }

      function writeThemeSettings(themeId, settingsSnapshot) {
        if (!APP_CONFIG.settings?.persistSettings || !themeId) return;
        try {
          const stored = readStoredSettings();
          const trailDefaultRevision = getThemeById(themeId)?.settings?.trailDefaultRevision;
          stored.themes[themeId] = {
            ...settingsSnapshot,
            ...(typeof trailDefaultRevision === 'string' && trailDefaultRevision
              ? { trailDefaultRevision }
              : {}),
          };
          localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(stored));
          localStorage.removeItem(LEGACY_SETTINGS_STORAGE_KEY);
        } catch (error) {
          // Wallpaper hosts may disable storage. Runtime settings still work.
        }
      }

      function flushScheduledThemeSettingsPersistence() {
        clearTimeout(persistTextTimer);
        persistTextTimer = null;
        if (!pendingTextPersistence) return;
        const pending = pendingTextPersistence;
        pendingTextPersistence = null;
        writeThemeSettings(pending.themeId, pending.settings);
      }

      function persistThemeSettings() {
        if (!APP_CONFIG.settings?.persistSettings || !activeTheme) return;
        flushScheduledThemeSettingsPersistence();
        writeThemeSettings(activeTheme.id, {
          ...activeSettings,
          textOverrides: { ...(activeSettings.textOverrides || {}) },
        });
      }

      function scheduleThemeSettingsPersistence() {
        if (!APP_CONFIG.settings?.persistSettings || !activeTheme) return;
        clearTimeout(persistTextTimer);
        pendingTextPersistence = {
          themeId: activeTheme.id,
          settings: {
            ...activeSettings,
            textOverrides: { ...(activeSettings.textOverrides || {}) },
          },
        };
        persistTextTimer = setTimeout(flushScheduledThemeSettingsPersistence, 250);
      }

      function loadThemeSettings(theme) {
        const defaults = theme.settings?.defaults || {};
        const stored = readStoredSettings().themes[theme.id] || {};
        const configuredTrailRevision = theme.settings?.trailDefaultRevision;
        const shouldApplyNewTrailDefault = typeof configuredTrailRevision === 'string' &&
          configuredTrailRevision && stored.trailDefaultRevision !== configuredTrailRevision;
        return sanitizeThemeSettings(theme, {
          ...defaults,
          ...stored,
          ...(shouldApplyNewTrailDefault ? { trailId: defaults.trailId } : {}),
        });
      }

      function startDrawingWhenImagesReady(generation) {
        if (generation !== imageLoadGeneration) return;
        const currentImagesReady = top.complete && top.naturalWidth > 0 &&
          bottom.complete && bottom.naturalWidth > 0;
        if (!currentImagesReady) return;

        imagesReady = true;
        document.body.dataset.imageState = 'ready';
        lastFrameTime = 0;
        if (!isPaused) {
          if (animFrameId) cancelAnimationFrame(animFrameId);
          animFrameId = requestAnimationFrame(draw);
        }
      }

      function loadThemeImages(theme) {
        const generation = ++imageLoadGeneration;
        imagesReady = false;
        document.body.dataset.imageState = 'loading';
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }

        const handleLoad = () => startDrawingWhenImagesReady(generation);
        const handleError = event => {
          if (generation !== imageLoadGeneration) return;
          imagesReady = false;
          document.body.dataset.imageState = 'error';
          const failedSource = event.currentTarget?.currentSrc || event.currentTarget?.src || 'unknown image';
          console.error(`Wallpaper artwork failed to load: ${failedSource}`);
        };

        top.onload = handleLoad;
        bottom.onload = handleLoad;
        top.onerror = handleError;
        bottom.onerror = handleError;
        top.src = theme.assets.imageAtRest;
        bottom.src = theme.assets.imageInTrail;

        // Cached local images can already be complete before a load event is observed.
        startDrawingWhenImagesReady(generation);
      }

      function applyTheme(themeId, preferredTrailId) {
        flushScheduledThemeSettingsPersistence();
        const theme = getThemeById(themeId);
        const trailOptions = getTrailOptions(theme.id);
        activeTheme = theme;
        activeSettings = loadThemeSettings(theme);
        if (query.get('motion') === 'on' &&
          theme.motion?.enabled === true &&
          getThemeCapabilities(theme).has('artworkMotion')) {
          activeSettings.artworkMotion = true;
        }

      settingsBtn.addEventListener('click', () => {

      });
      customerSettingsBtn.addEventListener('click', () => {
        setSettingsPanelOpen(settingsPanel.style.display === 'none', customerSettingsBtn);
      });
      closeSettingsBtn.addEventListener('click', () => setSettingsPanelOpen(false));

      const toggleBtn = document.createElement('button');
      toggleBtn.textContent = 'HIDE UI (H)';
      toggleBtn.style.cssText = themeBtn.style.cssText;
      toggleBtn.onmouseover = () => { toggleBtn.style.background = 'rgba(255,255,255,0.9)'; toggleBtn.style.color = '#000'; };
      toggleBtn.onmouseout = () => { toggleBtn.style.background = 'rgba(0,0,0,0.65)'; toggleBtn.style.color = '#fff'; };

      function setUiHidden(isHidden) {
        setRuntimeSetting('showUi', !isHidden);
      }

      function toggleUi() {
        setUiHidden(!document.body.classList.contains('ui-hidden'));
      }

      window.livelyPropertyListener = function (name, value) {
        if (name === 'showUi') {
          setRuntimeSetting('showUi', value === true || value === 'true', { persist: false });
        } else if (name === 'artworkMotion') {
          motionPreviewEnabled = true;
          setRuntimeSetting('artworkMotion', value === true || value === 'true', { persist: false });
        } else if (name === 'showSettingsButton') {
          setRuntimeSetting('showSettingsButton', value === true || value === 'true', { persist: false });
        } else if (name === 'headSize') {
          setRuntimeSetting('headSize', Number(value), { persist: false });
        } else if (name === 'trailPersistence') {
          setRuntimeSetting('trailPersistence', Number(value), { persist: false });
        } else if (name === 'effectIntensity') {
          setRuntimeSetting('effectIntensity', Number(value), { persist: false });
        } else if (name === 'glowStrength') {
          setRuntimeSetting('glowStrength', Number(value), { persist: false });
        } else if (name === 'backgroundDimming') {
          setRuntimeSetting('backgroundDimming', Number(value), { persist: false });
        } else if (name === 'performanceMode') {
          const performanceOptions = APP_CONFIG.controls?.performanceMode?.options || ['balanced'];
          const selectedMode = Number.isInteger(Number(value))
            ? performanceOptions[Number(value)]
            : String(value);
          setRuntimeSetting('performanceMode', selectedMode, { persist: false });
        } else if (name === 'trailId') {
          const trails = getThemeTrails(activeTheme);
          const selectedTrail = Number.isInteger(Number(value))
            ? trails[Number(value)]?.id
            : String(value);
          setRuntimeSetting('trailId', selectedTrail, { persist: false });
        } else if (Object.prototype.hasOwnProperty.call(LIVELY_TEXT_PROPERTIES, name)) {
          setRuntimeTextSetting(LIVELY_TEXT_PROPERTIES[name], String(value ?? ''), {
            persist: false,

      toggleBtn.addEventListener('mousedown', (event) => {
        event.preventDefault();

      function isEditableTarget(target) {
        return target instanceof Element && Boolean(
          target.closest('input, textarea, select, [contenteditable="true"], [contenteditable=""]'),
        );
      }

      function handleUiHotkey(event) {
        const isEscape = event.code === 'Escape' || event.key === 'Escape';
        if (isEscape && !usesNativeHostSettings && settingsPanel.style.display !== 'none') {
          event.preventDefault();
          setSettingsPanelOpen(false);
          return;
        }
        if (isEditableTarget(event.target)) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        const isH = event.code === 'KeyH' || String(event.key).toLowerCase() === 'h';
        const isM = event.code === 'KeyM' || String(event.key).toLowerCase() === 'm';
        if (event.repeat) return;
        if (isH) {
          event.preventDefault();
          toggleUi();
        } else if (isM && !usesNativeHostSettings && APP_CONFIG.settings?.showSettingsPanel) {
          event.preventDefault();
          setSettingsPanelOpen(settingsPanel.style.display === 'none');
        }
      }

      document.addEventListener('keydown', handleUiHotkey, true);
      window.addEventListener('pagehide', flushScheduledThemeSettingsPersistence);
      document.documentElement.tabIndex = -1;
      hero.addEventListener('mousedown', () => {
        document.documentElement.focus({ preventScroll: true });
      });

      function updateSettingsControls() {
        const capabilities = getThemeCapabilities(activeTheme);
        const themeTrails = getThemeTrails(activeTheme);
        const canSelectTrail = capabilities.has('trailSelection') && themeTrails.length > 1;
        const supportedTextFields = new Set(getThemeTextFields(activeTheme));
        const canCustomizeText = capabilities.has('textCustomization') && supportedTextFields.size > 0;
        headSizeControl.style.display = capabilities.has('headSize') ? 'grid' : 'none';
        persistenceControl.row.style.display = capabilities.has('trailPersistence') ? 'grid' : 'none';
        intensityControl.row.style.display = capabilities.has('effectIntensity') ? 'grid' : 'none';
        glowControl.row.style.display = capabilities.has('glowStrength') ? 'grid' : 'none';

        artworkMotionControl.style.display = capabilities.has('artworkMotion') ? 'flex' : 'none';
        showUiControl.style.display = capabilities.has('uiVisibility') ? 'flex' : 'none';
        settingsButtonControl.style.display = isCustomerBrowserBuild &&
          capabilities.has('settingsButtonVisibility') ? 'flex' : 'none';

        const resolvedContent = resolveThemeContent();

        restoreTextBtn.style.opacity = restoreTextBtn.disabled ? '0.45' : '1';
        restoreTextBtn.style.cursor = restoreTextBtn.disabled ? 'default' : 'pointer';

        const existingTrailIds = Array.from(trailSelect.options).map(option => option.value);
        const nextTrailIds = themeTrails.map(trail => trail.id);

            option.textContent = trailDefinition.name;

        headSizeInput.value = String(activeSettings.headSize);
        headSizeLabel.textContent = `Head size \u00b7 ${activeSettings.headSize}%`;
        for (const control of [persistenceControl, intensityControl, glowControl, dimmingControl]) {
          const value = activeSettings[control.settingName];

        }
        performanceSelect.value = activeSettings.performanceMode;
        trailSelect.value = activeTrailId;
        artworkMotionCheckbox.checked = activeSettings.artworkMotion !== false;
        showUiCheckbox.checked = activeSettings.showUi;
        settingsButtonCheckbox.checked = activeSettings.showSettingsButton;
        settingsHeading.textContent = isDevelopmentBuild
          ? `${activeTheme.themeName} settings`
          : 'Wallpaper settings';
        settingsDescription.textContent = isDevelopmentBuild
          ? 'Development controls for motion, text, visuals, and theme testing.'
          : 'Personalize the interaction and text. Press M anytime to open or close this menu.';
        const isHidden = !activeSettings.showUi;
        toggleBtn.textContent = isHidden ? 'SHOW UI (H)' : 'HIDE UI (H)';
        if (isDevelopmentBuild) {
          // H is the recovery path in development too: a hidden interface must
          // not leave the development toolbar or Settings entry point on screen.
          devUiContainer.style.display = isHidden ? 'none' : 'flex';
          settingsPanel.style.opacity = '1';
        } else {
          settingsPanel.style.opacity = '1';
          const showCustomerSettingsButton = activeSettings.showUi &&
            activeSettings.showSettingsButton;

          customerSettingsBtn.style.opacity = showCustomerSettingsButton ? '1' : '0';
