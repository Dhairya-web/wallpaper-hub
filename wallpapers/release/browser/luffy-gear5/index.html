      }

      function isolateSettingsSurface(surface) {
        surface.addEventListener('mouseenter', () => { pointerActive = false; });
        surface.addEventListener('touchstart', () => { pointerActive = false; }, { passive: true });
        surface.addEventListener('mousemove', event => event.stopPropagation());
        surface.addEventListener('touchmove', event => event.stopPropagation(), { passive: true });
      }

      isolateSettingsSurface(devUiContainer);
      isolateSettingsSurface(settingsPanel);
      isolateSettingsSurface(customerSettingsBtn);

      if (isDevelopmentBuild) {
        devUiContainer.appendChild(toggleBtn);
        if (APP_CONFIG.settings?.showThemeSwitcher) {
          devUiContainer.appendChild(themeBtn);
          devUiContainer.appendChild(trailBtn);
          devUiContainer.appendChild(motionBtn);
        }
        if (APP_CONFIG.settings?.showSettingsPanel) {
          devUiContainer.appendChild(settingsBtn);
          hero.appendChild(settingsPanel);
        }
        hero.appendChild(devUiContainer);
      } else if (isCustomerBrowserBuild) {
        settingsPanel.style.top = 'auto';
        settingsPanel.style.right = '18px';
        settingsPanel.style.bottom = '70px';
        closeSettingsBtn.style.display = 'grid';
        hero.appendChild(settingsPanel);
        hero.appendChild(customerSettingsBtn);
      } else if (usesNativeHostSettings) {
        // Lively and Wallpaper Engine expose settings in their own customer UI.
        setSettingsPanelOpen(false);
      }
      updateSettingsControls();

      // --- Rendering Logic ---
      const off = document.createElement('canvas');
      const offc = off.getContext('2d');

      function cover(img, cw, ch) {
        const ir = img.width / img.height, cr = cw / ch;
        let w, h, x, y;
        if (ir > cr) { h = ch; w = ch * ir; x = (cw - w) / 2; y = 0; }
        else { w = cw; h = cw / ir; x = 0; y = (ch - h) / 2; }
        return [x, y, w, h];
      }

      function getLivingMotionConfig() {
        return motionPreviewEnabled &&
          activeSettings.artworkMotion !== false &&
          activeTheme.motion?.enabled === true
          ? activeTheme.motion
          : null;
      }

      function makeSeededRandom(seedText) {
        let state = 2166136261;
        for (const character of seedText) {
          state ^= character.codePointAt(0);
          state = Math.imul(state, 16777619);
        }
        return function random() {
          state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
          return state / 4294967296;
        };
      }

      function getPerformanceCount(counts) {
        return counts?.[activeSettings.performanceMode] || 0;
      }

      function resetLivingMotion() {
        livingMotionState.offsetX = 0;
        livingMotionState.offsetY = 0;
        livingMotionState.flowX = 0;
        livingMotionState.flowY = 0;
        livingMotionState.previousPointerX = 0;
        livingMotionState.previousPointerY = 0;
        livingMotionState.pointerReady = false;
        livingPetalParticles = [];
        livingMoteParticles = [];
        livingConstellationLinks = [];
        livingMistLayers = [];

        const motion = getLivingMotionConfig();
        if (!motion) return;
        const atmosphere = motion.atmosphere;
        const random = makeSeededRandom(`${activeTheme.id}:${activeSettings.performanceMode}`);

        for (let index = 0; index < getPerformanceCount(atmosphere.petalCount); index++) {
          livingPetalParticles.push({
            x: random(),
            y: random(),
            speed: 0.006 + random() * 0.011,
            drift: 0.003 + random() * 0.007,
            sway: 0.003 + random() * 0.009,
            phase: random() * Math.PI * 2,
            size: 1.2 + random() * 2.5,
            spin: 0.12 + random() * 0.30,
            gold: random() > 0.74,
          });
        }

        for (let index = 0; index < getPerformanceCount(atmosphere.moteCount); index++) {
          livingMoteParticles.push({
            x: random(),
            y: 0.16 + random() * 0.76,
            speed: 0.006 + random() * 0.012,
            sway: 0.004 + random() * 0.014,
            phase: random() * Math.PI * 2,
            size: 0.8 + random() * 1.8,
            gold: random() > 0.72,
          });
        }

        for (let index = 0; index < getPerformanceCount(atmosphere.constellationLinkCount); index++) {
          livingConstellationLinks.push({
            x: 0.40 + random() * 0.54,
            y: 0.12 + random() * 0.72,
            length: 0.028 + random() * 0.055,
            angle: -0.9 + random() * 1.8,
            drift: 0.002 + random() * 0.004,
            phase: random() * Math.PI * 2,
          });
        }

        for (let index = 0; index < getPerformanceCount(atmosphere.mistCount); index++) {
          livingMistLayers.push({
            x: 0.12 + random() * 0.54,
            y: 0.18 + random() * 0.52,
            radius: 0.12 + random() * 0.10,
            drift: 0.006 + random() * 0.008,
            phase: random() * Math.PI * 2,
          });
        }
      }

      function updateLivingMotion(now, deltaSeconds, width, height) {
        const motion = getLivingMotionConfig();
        if (!motion) return;
        const parallax = motion.parallax;
        const normalizedX = pointerActive && pointerInitialized
          ? Math.max(-1, Math.min(1, (smooth.x / Math.max(1, width) - 0.5) * 2))
          : 0;
        const normalizedY = pointerActive && pointerInitialized
          ? Math.max(-1, Math.min(1, (smooth.y / Math.max(1, height) - 0.5) * 2))
          : 0;
        const targetX = -normalizedX * parallax.pointerStrengthX +
          Math.sin(now * 0.000073) * parallax.ambientStrengthX;
        const targetY = -normalizedY * parallax.pointerStrengthY +
          Math.cos(now * 0.000061) * parallax.ambientStrengthY;
        const follow = 1 - Math.exp(-parallax.followRate * deltaSeconds);
        livingMotionState.offsetX += (targetX - livingMotionState.offsetX) * follow;
        livingMotionState.offsetY += (targetY - livingMotionState.offsetY) * follow;

        const deformation = motion.deformation;
        if (!deformation.enabled || deformation.sourceType !== 'layered-cutouts') {
          const settle = 1 - Math.exp(-deformation.pointerDecayRate * deltaSeconds);
          livingMotionState.flowX += (0 - livingMotionState.flowX) * settle;
          livingMotionState.flowY += (0 - livingMotionState.flowY) * settle;
          livingMotionState.pointerReady = false;
          return;
        }
        let targetFlowX = 0;
        let targetFlowY = 0;
        if (pointerActive && pointerInitialized) {
          if (livingMotionState.pointerReady) {
            const minimumDimension = Math.max(1, Math.min(width, height));
            const safeDelta = Math.max(1 / 240, deltaSeconds);
            const velocityX = (smooth.x - livingMotionState.previousPointerX) /
              (minimumDimension * safeDelta);
            const velocityY = (smooth.y - livingMotionState.previousPointerY) /
              (minimumDimension * safeDelta);
            targetFlowX = Math.max(-1, Math.min(1, velocityX * deformation.pointerResponse));
            targetFlowY = Math.max(-1, Math.min(1, velocityY * deformation.pointerResponse));
          }
          livingMotionState.pointerReady = true;
          livingMotionState.previousPointerX = smooth.x;
          livingMotionState.previousPointerY = smooth.y;
        } else {
          livingMotionState.pointerReady = false;
        }
        const flowRate = pointerActive
          ? deformation.pointerFollowRate
          : deformation.pointerDecayRate;
        const flowFollow = 1 - Math.exp(-flowRate * deltaSeconds);
        livingMotionState.flowX += (targetFlowX - livingMotionState.flowX) * flowFollow;
        livingMotionState.flowY += (targetFlowY - livingMotionState.flowY) * flowFollow;
      }

      function coverWithLivingMotion(img, width, height) {
        const frame = cover(img, width, height);
        const motion = getLivingMotionConfig();
        if (!motion) return frame;
        const scale = motion.parallax.overscanScale;
        const scaledWidth = frame[2] * scale;
        const scaledHeight = frame[3] * scale;
        return [
          frame[0] - (scaledWidth - frame[2]) * 0.5 + livingMotionState.offsetX,
          frame[1] - (scaledHeight - frame[3]) * 0.5 + livingMotionState.offsetY,
          scaledWidth,
          scaledHeight,
        ];
      }

      function wrapUnit(value) {
        return value - Math.floor(value);
      }

      function appendLivingPolygon(targetContext, imageFrame, points, offsets = null) {
        points.forEach((point, index) => {
          const offset = offsets?.[index] || [0, 0];
          const x = imageFrame[0] + imageFrame[2] * point[0] + offset[0];
          const y = imageFrame[1] + imageFrame[3] * point[1] + offset[1];
          if (index === 0) targetContext.moveTo(x, y);
          else targetContext.lineTo(x, y);
        });
        targetContext.closePath();
      }

      function pointInsideLivingPolygon(x, y, points) {
        let inside = false;
        for (let current = 0, previous = points.length - 1; current < points.length; previous = current++) {
          const currentPoint = points[current];
          const previousPoint = points[previous];
          const verticalDelta = previousPoint[1] - currentPoint[1];
          const safeVerticalDelta = Math.abs(verticalDelta) < 1e-9
            ? (verticalDelta < 0 ? -1e-9 : 1e-9)
            : verticalDelta;
          const crosses = ((currentPoint[1] > y) !== (previousPoint[1] > y)) &&
            (x < (previousPoint[0] - currentPoint[0]) * (y - currentPoint[1]) /
              safeVerticalDelta + currentPoint[0]);
          if (crosses) inside = !inside;
        }
        return inside;
      }

      function getLivingRegionBounds(region) {
        const cached = livingRegionBounds.get(region);
        if (cached) return cached;
        let minX = 1;
        let maxX = 0;
        let minY = 1;
        let maxY = 0;
        for (const point of region.points) {
          minX = Math.min(minX, point[0]);
          maxX = Math.max(maxX, point[0]);
          minY = Math.min(minY, point[1]);
          maxY = Math.max(maxY, point[1]);
        }
        const bounds = {
          minX: Math.max(0, minX),
          maxX: Math.min(1, maxX),
          minY: Math.max(0, minY),
          maxY: Math.min(1, maxY),
        };
        livingRegionBounds.set(region, bounds);
        return bounds;
      }

      function getLivingMesh(region, density) {
        let cachedByDensity = livingRegionMeshes.get(region);
        if (!cachedByDensity) {
          cachedByDensity = new Map();
          livingRegionMeshes.set(region, cachedByDensity);
        }
        if (cachedByDensity.has(density)) return cachedByDensity.get(density);

        const { minX, maxX, minY, maxY } = getLivingRegionBounds(region);
        const spanX = maxX - minX;
        const spanY = maxY - minY;
        const alongSpan = region.axis === 'x' ? spanX : spanY;
        const crossSpan = region.axis === 'x' ? spanY : spanX;
        const alongSegments = Math.max(2, density);
        const crossSegments = Math.max(
          2,
          Math.min(alongSegments, Math.round(alongSegments * crossSpan / Math.max(1e-6, alongSpan))),
        );
        const columns = region.axis === 'x' ? alongSegments : crossSegments;
        const rows = region.axis === 'x' ? crossSegments : alongSegments;
        const vertices = [];
        for (let row = 0; row <= rows; row++) {
          for (let column = 0; column <= columns; column++) {
            vertices.push([
              minX + spanX * column / columns,
              minY + spanY * row / rows,
            ]);
          }
        }

        const triangles = [];
        const vertexAt = (column, row) => row * (columns + 1) + column;
        for (let row = 0; row < rows; row++) {
          for (let column = 0; column < columns; column++) {
            const topLeft = vertexAt(column, row);
            const topRight = vertexAt(column + 1, row);
            const bottomLeft = vertexAt(column, row + 1);
            const bottomRight = vertexAt(column + 1, row + 1);
            const centerX = (vertices[topLeft][0] + vertices[bottomRight][0]) * 0.5;
            const centerY = (vertices[topLeft][1] + vertices[bottomRight][1]) * 0.5;
            const intersectsRegion = pointInsideLivingPolygon(centerX, centerY, region.points) ||
              [topLeft, topRight, bottomLeft, bottomRight].some(index =>
                pointInsideLivingPolygon(vertices[index][0], vertices[index][1], region.points));
            if (!intersectsRegion) continue;
            triangles.push([topLeft, topRight, bottomRight], [topLeft, bottomRight, bottomLeft]);
          }
        }

        const mesh = { vertices, triangles };
        cachedByDensity.set(density, mesh);
        return mesh;
      }

      function getLivingPointOffset(region, bounds, point, now, imageScale) {
        const spanX = Math.max(1e-6, bounds.maxX - bounds.minX);
        const spanY = Math.max(1e-6, bounds.maxY - bounds.minY);
        const localX = Math.max(0, Math.min(1, (point[0] - bounds.minX) / spanX));
        const localY = Math.max(0, Math.min(1, (point[1] - bounds.minY) / spanY));
        const along = region.axis === 'x' ? localX : localY;
        const across = region.axis === 'x' ? localY : localX;
        const distanceFromAnchor = region.anchor === 'end' ? 1 - along : along;
        const easedDistance = distanceFromAnchor * distanceFromAnchor * (3 - 2 * distanceFromAnchor);
        const freedom = Math.pow(Math.max(0, easedDistance), region.falloff);
        const elapsed = now * 0.001;
        const phase = elapsed * region.speed * Math.PI * 2 +
          along * region.frequency + region.phase + (across - 0.5) * 0.68;
        const wave = Math.sin(phase) * 0.52 +
          Math.sin(phase * 0.51 + 1.31) * 0.31 +
          Math.sin(phase * 0.23 + 2.17) * 0.17;
        const crossFlow = region.axis === 'x'
          ? livingMotionState.flowY
          : livingMotionState.flowX;
        const alongFlow = region.axis === 'x'
          ? livingMotionState.flowX
          : livingMotionState.flowY;
        const pointerInfluence = region.pointerInfluence;
        const crossOffset = (wave + crossFlow * pointerInfluence) *
          region.crossAmplitude * imageScale * freedom;
        const alongOffset = (
          Math.sin(phase * 0.63 + 0.79) * 0.62 + alongFlow * pointerInfluence * 0.38
        ) * region.alongAmplitude * imageScale * freedom;
        return region.axis === 'x'
          ? [alongOffset, crossOffset]
          : [crossOffset, alongOffset];
      }

      function expandLivingTriangle(points, padding) {
        const centerX = (points[0][0] + points[1][0] + points[2][0]) / 3;
        const centerY = (points[0][1] + points[1][1] + points[2][1]) / 3;
        return points.map(point => {
          const deltaX = point[0] - centerX;
          const deltaY = point[1] - centerY;
          const length = Math.hypot(deltaX, deltaY) || 1;
          const scale = (length + padding) / length;
          return [centerX + deltaX * scale, centerY + deltaY * scale];
        });
      }

      function drawLivingTexturedTriangle(targetContext, image, source, destination) {
        const sourcePixels = source.map(point => [point[0] * image.width, point[1] * image.height]);
        const [s0, s1, s2] = sourcePixels;
        const denominator = s0[0] * (s1[1] - s2[1]) +
          s1[0] * (s2[1] - s0[1]) + s2[0] * (s0[1] - s1[1]);
        if (Math.abs(denominator) < 1e-6) return;

        const solve = values => [
          (values[0] * (s1[1] - s2[1]) + values[1] * (s2[1] - s0[1]) +
            values[2] * (s0[1] - s1[1])) / denominator,
          (values[0] * (s2[0] - s1[0]) + values[1] * (s0[0] - s2[0]) +
            values[2] * (s1[0] - s0[0])) / denominator,
          (values[0] * (s1[0] * s2[1] - s2[0] * s1[1]) +
            values[1] * (s2[0] * s0[1] - s0[0] * s2[1]) +
            values[2] * (s0[0] * s1[1] - s1[0] * s0[1])) / denominator,
        ];
        const xTransform = solve(destination.map(point => point[0]));
        const yTransform = solve(destination.map(point => point[1]));
        const clipPoints = expandLivingTriangle(destination, 0.65);

        targetContext.save();
        targetContext.beginPath();
        targetContext.moveTo(clipPoints[0][0], clipPoints[0][1]);
        targetContext.lineTo(clipPoints[1][0], clipPoints[1][1]);
        targetContext.lineTo(clipPoints[2][0], clipPoints[2][1]);
        targetContext.closePath();
        targetContext.clip();
        targetContext.transform(
          xTransform[0],
          yTransform[0],
          xTransform[1],
          yTransform[1],
          xTransform[2],
          yTransform[2],
        );
        targetContext.drawImage(image, 0, 0);
        targetContext.restore();
      }

      function drawLivingPuppetRegion(
        targetContext,
        image,
        imageFrame,
        region,
        protectedAreas,
        now,
        deformation,
      ) {
        const meshDensity = getPerformanceCount(deformation.meshDensity);
        if (!meshDensity || !region.points?.length) return;

        const bounds = getLivingRegionBounds(region);
        if (bounds.maxX - bounds.minX <= 0 || bounds.maxY - bounds.minY <= 0) return;
        const imageScale = Math.min(Math.abs(imageFrame[2]), Math.abs(imageFrame[3]));
        const mesh = getLivingMesh(region, meshDensity);
        const offsets = mesh.vertices.map(point =>
          getLivingPointOffset(region, bounds, point, now, imageScale));
        const destination = mesh.vertices.map((point, index) => [
          imageFrame[0] + point[0] * imageFrame[2] + offsets[index][0],
          imageFrame[1] + point[1] * imageFrame[3] + offsets[index][1],
        ]);
        const outlineOffsets = region.points.map(point =>
          getLivingPointOffset(region, bounds, point, now, imageScale));

        targetContext.save();
        targetContext.beginPath();
        appendLivingPolygon(targetContext, imageFrame, region.points, outlineOffsets);
        for (const protectedArea of protectedAreas || []) {
          appendLivingPolygon(targetContext, imageFrame, protectedArea);
        }
        targetContext.clip('evenodd');
        targetContext.globalAlpha = region.opacity;
        targetContext.imageSmoothingEnabled = true;
        targetContext.imageSmoothingQuality = activeSettings.performanceMode === 'quality'
          ? 'high'
          : 'medium';
        for (const triangle of mesh.triangles) {
          drawLivingTexturedTriangle(
            targetContext,
            image,
            triangle.map(index => mesh.vertices[index]),
            triangle.map(index => destination[index]),
          );
        }
        targetContext.restore();
      }

      function drawLivingPuppetRegions(
        targetContext,
        image,
        imageFrame,
        regions,
        protectedAreas,
        now,
      ) {
        const motion = getLivingMotionConfig();
        if (!motion || !regions?.length) return;
        for (const region of regions) {
          drawLivingPuppetRegion(
            targetContext,
            image,
            imageFrame,
            region,
            protectedAreas,
            now,
            motion.deformation,
          );
        }
      }

      function drawLivingRestingAtmosphere(targetContext, now, width, height) {
        const motion = getLivingMotionConfig();
        if (!motion) return;
        const atmosphere = motion.atmosphere;
        const elapsed = now * 0.001 * atmosphere.speedScale;

        targetContext.save();
        targetContext.globalCompositeOperation = 'screen';
        for (const mist of livingMistLayers) {
          const x = wrapUnit(mist.x + elapsed * mist.drift) * width;
          const y = (mist.y + Math.sin(elapsed * 0.11 + mist.phase) * 0.025) * height;
          const radius = Math.max(width, height) * mist.radius;
          const gradient = targetContext.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, 'rgba(115,170,180,0.045)');
          gradient.addColorStop(0.58, 'rgba(82,116,130,0.022)');
          gradient.addColorStop(1, 'rgba(0,0,0,0)');
          targetContext.fillStyle = gradient;
          targetContext.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }
        targetContext.restore();

        if (!livingPetalParticles.length) return;
        targetContext.save();
        targetContext.globalCompositeOperation = 'screen';
        targetContext.globalAlpha = atmosphere.restingOpacity;
        for (const particle of livingPetalParticles) {
          const x = wrapUnit(
            particle.x + elapsed * particle.drift +
            Math.sin(elapsed * 0.32 + particle.phase) * particle.sway,
          ) * width;
          const y = wrapUnit(particle.y - elapsed * particle.speed) * height;
          const angle = particle.phase + elapsed * particle.spin;
          targetContext.save();
          targetContext.translate(x, y);
          targetContext.rotate(angle);
          targetContext.beginPath();
          targetContext.ellipse(0, 0, particle.size * 1.7, particle.size * 0.58, 0, 0, Math.PI * 2);
          targetContext.fillStyle = particle.gold
            ? 'rgba(246,210,133,0.48)'
            : 'rgba(154,245,237,0.46)';
          targetContext.fill();
          targetContext.restore();
        }
        targetContext.restore();
      }

      function drawLivingRevealedAtmosphere(targetContext, now, width, height, imageFrame) {
        const motion = getLivingMotionConfig();
        if (!motion) return;
        const atmosphere = motion.atmosphere;
        const elapsed = now * 0.001 * atmosphere.speedScale;

        targetContext.save();
        targetContext.globalCompositeOperation = 'source-atop';
        targetContext.globalAlpha = atmosphere.revealedOpacity;

        if (livingConstellationLinks.length) {
          targetContext.beginPath();
          for (const link of livingConstellationLinks) {
            const sway = Math.sin(elapsed * 0.16 + link.phase) * 0.008;
            const x = wrapUnit(link.x + elapsed * link.drift) * width;
            const y = (link.y + sway) * height;
            const length = link.length * Math.min(width, height);
            targetContext.moveTo(x, y);
            targetContext.lineTo(
              x + Math.cos(link.angle) * length,
              y + Math.sin(link.angle) * length,
            );
          }
          targetContext.strokeStyle = 'rgba(143,231,246,0.24)';
          targetContext.lineWidth = 0.75;
          targetContext.stroke();
        }

        for (const particle of livingMoteParticles) {
          const x = wrapUnit(
            particle.x + Math.sin(elapsed * 0.24 + particle.phase) * particle.sway,
          ) * width;
          const y = wrapUnit(particle.y - elapsed * particle.speed) * height;
          targetContext.beginPath();
          targetContext.arc(x, y, particle.size, 0, Math.PI * 2);
          targetContext.fillStyle = particle.gold
            ? 'rgba(244,207,126,0.74)'
            : 'rgba(134,248,238,0.72)';
          targetContext.fill();
        }

        const starseedX = imageFrame[0] + imageFrame[2] * atmosphere.starseed.x;
        const starseedY = imageFrame[1] + imageFrame[3] * atmosphere.starseed.y;
        const starseedRadius = Math.min(imageFrame[2], imageFrame[3]) * atmosphere.starseed.radiusScale;
        const glow = targetContext.createRadialGradient(
          starseedX, starseedY, 0,
          starseedX, starseedY, starseedRadius,
        );
        glow.addColorStop(0, 'rgba(238,255,250,0.22)');
        glow.addColorStop(0.34, 'rgba(91,231,226,0.10)');
        glow.addColorStop(0.72, 'rgba(228,190,114,0.045)');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        targetContext.globalAlpha = 1;
        targetContext.fillStyle = glow;
        targetContext.fillRect(
          starseedX - starseedRadius,
          starseedY - starseedRadius,
          starseedRadius * 2,
          starseedRadius * 2,
        );
        targetContext.restore();
      }

      function resize() {
        const w = hero.offsetWidth, h = hero.offsetHeight;
        const interaction = getThemeInteraction();
        const deviceScale = window.devicePixelRatio || 1;
        const memorySafeScale = Math.sqrt(getRenderPixelBudget() / Math.max(1, w * h));
        renderScale = Math.min(deviceScale, memorySafeScale);
        canvas.width = Math.max(1, Math.round(w * renderScale));
        canvas.height = Math.max(1, Math.round(h * renderScale));
        off.width = canvas.width;
        off.height = canvas.height;
        ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
        offc.setTransform(renderScale, 0, 0, renderScale, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        offc.imageSmoothingEnabled = true;
        offc.imageSmoothingQuality = 'high';
        // The original Minimal Reveal is the sizing authority for every trail.
        HEAD_RADIUS = Math.max(
          interaction.headRadius.minimum,
          Math.min(w, h) * interaction.headRadius.viewportScale,
        );
        resetLivingMotion();
      }
      resize();
      window.addEventListener('resize', resize);

      function updatePointer(x, y) {
        const interaction = getThemeInteraction();
        const isDistantReentry = pointerInitialized && !pointerActive &&
          Math.hypot(x - smooth.x, y - smooth.y) >
            getTrailHeadRadius() * interaction.reentryDistanceScale;
        mouse.x = x;
        mouse.y = y;
        if (!pointerInitialized || isDistantReentry) {
          smooth.x = x;
          smooth.y = y;
          pointerInitialized = true;
          trail.length = 0;
          headLastActive = 0;
          nextTrailPointId = 0;
        }
        pointerActive = true;
        hint.style.opacity = 0;
      }

      function resetTrail() {
        trail.length = 0;
        lastFrameTime = 0;
        pointerInitialized = false;
        pointerActive = false;
        headLastActive = 0;
        nextTrailPointId = 0;
      }

      hero.addEventListener('mousemove', function (e) {
        const r = hero.getBoundingClientRect();
        updatePointer(e.clientX - r.left, e.clientY - r.top);
      });
      hero.addEventListener('touchmove', function (e) {
        const r = hero.getBoundingClientRect(); const t = e.touches[0];
        updatePointer(t.clientX - r.left, t.clientY - r.top);
      }, { passive: true });
      hero.addEventListener('mouseleave', () => { pointerActive = false; });
      hero.addEventListener('touchend', () => { pointerActive = false; }, { passive: true });
      hero.addEventListener('touchcancel', () => { pointerActive = false; }, { passive: true });

      window.livelyWallpaperPlaybackChanged = function (paused) {
        isPaused = paused;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        if (!isPaused && imagesReady) {
          lastFrameTime = 0;
          animFrameId = requestAnimationFrame(draw);
        }
      };

      function updateTrail(now, deltaSeconds) {
        if (!pointerInitialized) return;
        const interaction = getThemeInteraction();
        const sampling = interaction.sampling;

        const sizeFollow = 1 - Math.exp(-interaction.headSizeFollowRate * deltaSeconds);
        trailHeadScale += (targetTrailHeadScale - trailHeadScale) * sizeFollow;
        if (Math.abs(targetTrailHeadScale - trailHeadScale) < 0.0005) {
          trailHeadScale = targetTrailHeadScale;
        }
        const follow = 1 - Math.exp(-interaction.followRate * deltaSeconds);
        smooth.x += (mouse.x - smooth.x) * follow;
        smooth.y += (mouse.y - smooth.y) * follow;

        if (pointerActive) {
          headLastActive = now;
          const lastPoint = trail[trail.length - 1];
          // Keep samples evenly spaced and never insert the live endpoint.
          // The endpoint is drawn separately in buildTrailPath(), so a sample
          // crossing cannot duplicate it or reshape the head at small sizes.
          const spacing = Math.min(
            sampling.maximumSpacing,
            Math.max(sampling.minimumSpacing, getTrailHeadRadius() * sampling.headRadiusFactor),
          );
          const distance = lastPoint
            ? Math.hypot(smooth.x - lastPoint.x, smooth.y - lastPoint.y)
            : Infinity;

          if (!lastPoint) {
            trail.push(makeTrailPoint(smooth.x, smooth.y, now));
          } else if (distance >= spacing) {
            const sampleCount = Math.min(
              sampling.maxSamplesPerFrame,
              Math.floor((distance - 0.001) / spacing),
            );
            for (let step = 1; step <= sampleCount; step++) {
              const progress = (spacing * step) / distance;
              trail.push(makeTrailPoint(
                lastPoint.x + (smooth.x - lastPoint.x) * progress,
                lastPoint.y + (smooth.y - lastPoint.y) * progress,
                now - Math.min(34, deltaSeconds * 1000) * (1 - progress),
              ));
            }
          }
        }

        const trailDuration = getTrailDurationMs();
        while (trail.length && now - trail[0].born > trailDuration) {
          trail.shift();
        }
        if (trail.length > interaction.maxTrailPoints) {
          trail.splice(0, trail.length - interaction.maxTrailPoints);
        }
      }

      function makeTrailPoint(x, y, born) {
        return { x, y, born, id: nextTrailPointId++ };
      }

      function getHeadLife(now) {
        if (!pointerInitialized || !headLastActive) return 0;
        return 1 - Math.min(1, Math.max(0, (now - headLastActive) / getTrailDurationMs()));
      }

      function getTrailLife(point, now) {
        return 1 - Math.min(1, Math.max(0, (now - point.born) / getTrailDurationMs()));
      }

      function getTrailHeadRadius() {
        return HEAD_RADIUS * trailHeadScale;
      }

      function buildTrailPath(now) {
        const headLife = getHeadLife(now);
        if (headLife <= 0) return null;

        const points = trail.slice();
        const lastPoint = points[points.length - 1];
        if (!lastPoint || Math.hypot(smooth.x - lastPoint.x, smooth.y - lastPoint.y) > 0.01) {
          points.push({ x: smooth.x, y: smooth.y, born: headLastActive });
        }
        const distanceFromHead = new Array(points.length).fill(0);
        let accumulatedDistance = 0;
        for (let i = points.length - 2; i >= 0; i--) {
          accumulatedDistance += Math.hypot(
            points[i + 1].x - points[i].x,
            points[i + 1].y - points[i].y,
          );
          distanceFromHead[i] = accumulatedDistance;
        }
        return { points, headLife, distanceFromHead };
      }

      function drawFadingTrailSegments(targetContext, path, now, widthScale, color, opacityScale) {
        const points = path.points;
        if (points.length < 2) return;
        const ribbon = getThemeInteraction().ribbon;

        targetContext.lineCap = 'round';
        targetContext.lineJoin = 'round';
        targetContext.strokeStyle = color;

        for (let i = 0; i < points.length; i++) {
          const previous = points[Math.max(0, i - 1)];
          const point = points[i];
          const next = points[Math.min(points.length - 1, i + 1)];
          const life = getTrailLife(point, now);
          if (life <= 0) continue;

          const easedLife = life * life * (3 - 2 * life);
          const startX = i === 0 ? point.x : (previous.x + point.x) * 0.5;
          const startY = i === 0 ? point.y : (previous.y + point.y) * 0.5;
          const endX = i === points.length - 1 ? point.x : (point.x + next.x) * 0.5;
          const endY = i === points.length - 1 ? point.y : (point.y + next.y) * 0.5;

          targetContext.beginPath();
          targetContext.moveTo(startX, startY);
          targetContext.quadraticCurveTo(point.x, point.y, endX, endY);
          targetContext.globalAlpha = opacityScale * Math.pow(easedLife, ribbon.alphaExponent);
          const scaleBlend = Math.max(
            0,
            1 - path.distanceFromHead[i] /
              Math.max(1, HEAD_RADIUS * getThemeInteraction().headScaleBlendRadius),
          );
          const smoothScaleBlend = scaleBlend * scaleBlend * (3 - 2 * scaleBlend);
          const localHeadScale = 1 + (trailHeadScale - 1) * smoothScaleBlend;
          targetContext.lineWidth = HEAD_RADIUS * widthScale *
            (ribbon.tailWidthScale + easedLife * ribbon.lifeWidthScale) * localHeadScale;
          targetContext.stroke();
        }
      }

      function appendNormalizedPath(targetContext, x, y, radius, commands, mirrorX = false) {
        const mapX = value => x + radius * value * (mirrorX ? -1 : 1);
        const mapY = value => y + radius * value;
        for (const command of commands) {
          const [operation, ...values] = command;
          if (operation === 'M') targetContext.moveTo(mapX(values[0]), mapY(values[1]));
          else if (operation === 'L') targetContext.lineTo(mapX(values[0]), mapY(values[1]));
          else if (operation === 'Q') {
            targetContext.quadraticCurveTo(
              mapX(values[0]), mapY(values[1]),
              mapX(values[2]), mapY(values[3]),
            );
          } else if (operation === 'C') {
            targetContext.bezierCurveTo(
              mapX(values[0]), mapY(values[1]),
              mapX(values[2]), mapY(values[3]),
              mapX(values[4]), mapY(values[5]),
            );
          } else if (operation === 'Z') targetContext.closePath();
        }
      }

      function traceNormalizedPath(targetContext, x, y, radius, commands) {
        targetContext.beginPath();
        appendNormalizedPath(targetContext, x, y, Math.max(0.1, radius), commands);
      }

      function traceMirroredPath(targetContext, x, y, radius, commands) {
        targetContext.beginPath();
        appendNormalizedPath(targetContext, x, y, radius, commands);
        appendNormalizedPath(targetContext, x, y, radius, commands, true);
      }

      function drawGearPiTrailMask(now, path, style) {
        const mask = style.mask;
        const headEase = path.headLife * path.headLife * (3 - 2 * path.headLife);
        offc.save();
        offc.globalCompositeOperation = 'source-over';
        drawFadingTrailSegments(
          offc, path, now, mask.ribbonWidthScale, mask.ribbonColor, mask.ribbonOpacity,
        );
        traceNormalizedPath(
          offc,
          smooth.x,
          smooth.y,
          getTrailHeadRadius() * mask.cloudScale,
          mask.cloudCommands,
        );
        offc.fillStyle = mask.cloudColor;
        offc.globalAlpha = headEase;
        offc.fill();
        offc.restore();
        return path;
      }

      function drawGearPiCloudBorder(now, path, style) {
        if (!path) return;
        const effectStrength = getEffectIntensity() * getGlowStrength();
        const overlay = style.overlay;
        ctx.save();
        ctx.globalCompositeOperation = overlay.blendMode;
        for (const layer of overlay.ribbonLayers) {
          drawFadingTrailSegments(
            ctx,
            path,
            now,
            layer.widthScale,
            layer.color,
            layer.opacity * effectStrength,
          );
        }
        for (const layer of overlay.cloudLayers) {
          traceNormalizedPath(
            ctx,
            smooth.x,
            smooth.y,
            getTrailHeadRadius() * layer.scale,
            style.mask.cloudCommands,
          );
          ctx.globalAlpha = layer.opacity * path.headLife * effectStrength;
          ctx.fillStyle = layer.color;
          ctx.fill();
        }
        ctx.restore();
      }

      function drawMinimalRevealMask(now, path, style) {
        const mask = style.mask;
        offc.save();
        offc.globalCompositeOperation = 'source-over';
        drawFadingTrailSegments(
          offc, path, now, mask.ribbonWidthScale, mask.ribbonColor, mask.ribbonOpacity,
        );
        offc.globalAlpha = path.headLife;
        offc.beginPath();
        offc.arc(
          smooth.x,
          smooth.y,
          getTrailHeadRadius() * mask.headScale,
          0,
          Math.PI * 2,
        );
        offc.fillStyle = mask.headColor;
        offc.fill();
        offc.restore();
        return path;
      }

      function drawMinimalRevealGlow(path, style) {
        if (!path) return;
        const radius = getTrailHeadRadius() * style.glow.radiusScale;
        const glow = ctx.createRadialGradient(smooth.x, smooth.y, 0, smooth.x, smooth.y, radius);
        for (const stop of style.glow.stops) glow.addColorStop(stop.offset, stop.color);
        ctx.save();
        ctx.globalAlpha = path.headLife * getEffectIntensity() * getGlowStrength();
        ctx.beginPath();
        ctx.arc(smooth.x, smooth.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
        ctx.restore();
      }

      function drawHeroLightMask(now, path, style) {
        if (!path) return null;
        const mask = style.mask;
        offc.save();
        offc.globalCompositeOperation = 'source-over';
        drawFadingTrailSegments(
          offc, path, now, mask.ribbonWidthScale, mask.ribbonColor, mask.ribbonOpacity,
        );
        const radius = getTrailHeadRadius() * mask.headScale;
        const feather = offc.createRadialGradient(
          smooth.x, smooth.y, radius * mask.innerRadiusScale,
          smooth.x, smooth.y, radius,
        );
        for (const stop of mask.featherStops) feather.addColorStop(stop.offset, stop.color);
        offc.globalAlpha = path.headLife;
        offc.beginPath();
        offc.arc(smooth.x, smooth.y, radius, 0, Math.PI * 2);
        offc.fillStyle = feather;
        offc.fill();
        offc.restore();
        return path;
      }

      function drawHeroLightOverlay(now, path, style) {
        if (!path) return;
        const strength = getEffectIntensity() * getGlowStrength();
        const overlay = style.overlay;
        ctx.save();
        ctx.globalCompositeOperation = overlay.blendMode;
        for (const layer of overlay.ribbonLayers) {
          if (layer.skipInLowPower && activeSettings.performanceMode === 'low-power') continue;
          drawFadingTrailSegments(
            ctx,
            path,
            now,
            layer.widthScale,
            layer.color,
            layer.opacity * strength,
          );
        }
        const haloRadius = getTrailHeadRadius() * overlay.haloRadiusScale;
        const halo = ctx.createRadialGradient(
          smooth.x, smooth.y, 0,
          smooth.x, smooth.y, haloRadius,
        );
        for (const stop of overlay.haloStops) halo.addColorStop(stop.offset, stop.color);
        ctx.globalAlpha = path.headLife * strength;
        ctx.beginPath();
        ctx.arc(smooth.x, smooth.y, haloRadius, 0, Math.PI * 2);
        ctx.fillStyle = halo;
        ctx.fill();
        ctx.restore();
      }

      function traceWebBoundary(targetContext, x, y, radius, spokes, rotation, sagScale) {
        targetContext.beginPath();
        targetContext.moveTo(
          x + Math.cos(rotation) * radius,
          y + Math.sin(rotation) * radius,
        );
        for (let segment = 1; segment <= spokes; segment++) {
          const endAngle = rotation + (Math.PI * 2 * segment) / spokes;
          const middleAngle = endAngle - Math.PI / spokes;
          targetContext.quadraticCurveTo(
            x + Math.cos(middleAngle) * radius * sagScale,
            y + Math.sin(middleAngle) * radius * sagScale,
            x + Math.cos(endAngle) * radius,
            y + Math.sin(endAngle) * radius,
          );
        }
        targetContext.closePath();
      }

      function drawSpiderTrailMask(now, path, style) {
        const mask = style.mask;
        const headEase = path.headLife * path.headLife * (3 - 2 * path.headLife);
        const headRadius = getTrailHeadRadius();
        offc.save();
        offc.globalCompositeOperation = 'source-over';
        drawFadingTrailSegments(
          offc, path, now, mask.ribbonWidthScale, mask.ribbonColor, mask.ribbonOpacity,
        );

        // A closed-shape head owns the reveal boundary. Remove the ribbon's
        // circular cap first so it cannot show through behind the web.
        offc.globalCompositeOperation = 'destination-out';
        offc.globalAlpha = 1;
        offc.beginPath();
        offc.arc(smooth.x, smooth.y, headRadius * mask.clearScale, 0, Math.PI * 2);
        offc.fill();

        offc.globalCompositeOperation = 'source-over';
        offc.globalAlpha = headEase;
        offc.fillStyle = mask.headColor;
        traceWebBoundary(
          offc,
          smooth.x,
          smooth.y,
          headRadius * mask.headScale,
          mask.boundarySpokes,
          mask.boundaryRotationRadians,
          mask.boundarySagScale,
        );
        offc.fill();
        offc.restore();
        return path;
      }

      function drawWebTrailBody(now, path, style) {
        if (!path || path.points.length < 2) return;
        const points = path.points;
        const bucketCount = style.bucketCount;
        const bodyRadius = getTrailHeadRadius();
        ctx.save();
        ctx.globalCompositeOperation = style.blendMode;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = style.color;
        ctx.lineWidth = Math.max(style.lineWidthMinimum, bodyRadius * style.lineWidthScale);

        for (let bucket = 0; bucket < bucketCount; bucket++) {
          let hasGeometry = false;
          ctx.beginPath();
          for (let i = 0; i < points.length; i++) {
            const previous = points[Math.max(0, i - 1)];
            const point = points[i];
            const next = points[Math.min(points.length - 1, i + 1)];
            const life = getTrailLife(point, now);
            if (life <= 0) continue;
            const pointBucket = Math.min(bucketCount - 1, Math.floor(life * bucketCount));
            if (pointBucket !== bucket) continue;

            const tangentX = next.x - previous.x;
            const tangentY = next.y - previous.y;
            const tangentLength = Math.max(1, Math.hypot(tangentX, tangentY));
            const directionX = tangentX / tangentLength;
            const directionY = tangentY / tangentLength;
            const normalX = -directionY;
            const normalY = directionX;
            const startX = i === 0 ? point.x : (previous.x + point.x) * 0.5;
            const startY = i === 0 ? point.y : (previous.y + point.y) * 0.5;
            const endX = i === points.length - 1 ? point.x : (point.x + next.x) * 0.5;
            const endY = i === points.length - 1 ? point.y : (point.y + next.y) * 0.5;
            const strandSpread = bodyRadius * style.spreadScale *
              (style.spreadBase + life * style.spreadLifeScale);

            for (const strand of style.strandOffsets) {
              const offset = strand * strandSpread;
              ctx.moveTo(startX + normalX * offset, startY + normalY * offset);
              ctx.quadraticCurveTo(
                point.x + normalX * offset,
                point.y + normalY * offset,
                endX + normalX * offset,
                endY + normalY * offset,
              );
            }

            if (Number.isInteger(point.id) && point.id % style.crossbarEvery === 0) {
              ctx.moveTo(point.x - normalX * strandSpread, point.y - normalY * strandSpread);
              ctx.quadraticCurveTo(
                point.x - directionX * bodyRadius * style.crossbarBendScale,
                point.y - directionY * bodyRadius * style.crossbarBendScale,
                point.x + normalX * strandSpread,
                point.y + normalY * strandSpread,
              );
            }
            hasGeometry = true;
          }

          if (hasGeometry) {
            const bucketLife = (bucket + 1) / bucketCount;
            ctx.globalAlpha = (style.alphaBase + bucketLife * style.alphaLifeScale) *
              style.opacity * getEffectIntensity();
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function traceRadialWeb(targetContext, x, y, radius, style) {
        const { spokes, rings, rotationRadians, ringSagScale } = style;
        targetContext.beginPath();
        for (let spoke = 0; spoke < spokes; spoke++) {
          const angle = rotationRadians + (Math.PI * 2 * spoke) / spokes;
          targetContext.moveTo(x, y);
          targetContext.lineTo(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
        }

        for (let ring = 1; ring <= rings; ring++) {
          const ringRadius = radius * (ring / rings);
          targetContext.moveTo(
            x + Math.cos(rotationRadians) * ringRadius,
            y + Math.sin(rotationRadians) * ringRadius,
          );
          for (let segment = 1; segment <= spokes; segment++) {
            const endAngle = rotationRadians + (Math.PI * 2 * segment) / spokes;
            const middleAngle = endAngle - Math.PI / spokes;
            targetContext.quadraticCurveTo(
              x + Math.cos(middleAngle) * ringRadius * ringSagScale,
              y + Math.sin(middleAngle) * ringRadius * ringSagScale,
              x + Math.cos(endAngle) * ringRadius,
              y + Math.sin(endAngle) * ringRadius,
            );
          }
        }
      }

      function drawSpiderHead(now, path, style) {
        if (!path) return;
        const head = style.head;
        const radius = getTrailHeadRadius() * head.radiusScale;
        const intensity = getEffectIntensity();
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        traceRadialWeb(ctx, smooth.x, smooth.y, radius, head);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = head.darkLayer.opacity * path.headLife * intensity;
        ctx.strokeStyle = head.darkLayer.color;
        ctx.lineWidth = Math.max(
          head.darkLayer.lineWidthMinimum,
          radius * head.darkLayer.lineWidthScale,
        );
        ctx.stroke();

        traceRadialWeb(ctx, smooth.x, smooth.y, radius, head);
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = head.lightLayer.opacity * path.headLife * intensity;
        ctx.strokeStyle = head.lightLayer.color;
        ctx.lineWidth = Math.max(
          head.lightLayer.lineWidthMinimum,
          radius * head.lightLayer.lineWidthScale,
        );
        ctx.stroke();

        if (head.eyes) {
          const eyes = head.eyes;
          traceMirroredPath(ctx, smooth.x, smooth.y, radius, head.eyeCommands);
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = eyes.fill.opacity * path.headLife * intensity;
          ctx.fillStyle = eyes.fill.color;
          ctx.fill();
          ctx.globalAlpha = eyes.darkStroke.opacity * path.headLife * intensity;
          ctx.strokeStyle = eyes.darkStroke.color;
          ctx.lineWidth = Math.max(
            eyes.darkStroke.lineWidthMinimum,
            radius * eyes.darkStroke.lineWidthScale,
          );
          ctx.stroke();

          traceMirroredPath(ctx, smooth.x, smooth.y, radius, head.eyeCommands);
          ctx.globalCompositeOperation = 'screen';
          ctx.globalAlpha = eyes.accentStroke.opacity * path.headLife * intensity;
          ctx.strokeStyle = eyes.accentStroke.color;
          ctx.lineWidth = Math.max(
            eyes.accentStroke.lineWidthMinimum,
            radius * eyes.accentStroke.lineWidthScale,
          );
          ctx.shadowColor = eyes.accentStroke.shadowColor;
          ctx.shadowBlur = radius * eyes.accentStroke.shadowBlurScale * getGlowStrength();
          ctx.stroke();

          ctx.shadowColor = 'rgba(0,0,0,0)';
          ctx.shadowBlur = 0;
          traceMirroredPath(
            ctx,
            smooth.x,
            smooth.y,
            radius * eyes.highlightStroke.scale,
            head.eyeCommands,
          );
          ctx.globalAlpha = eyes.highlightStroke.opacity * path.headLife * intensity;
          ctx.strokeStyle = eyes.highlightStroke.color;
          ctx.lineWidth = Math.max(
            eyes.highlightStroke.lineWidthMinimum,
            radius * eyes.highlightStroke.lineWidthScale,
          );
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawSpiderTrailOverlay(now, path, style) {
        if (!path) return;
        drawWebTrailBody(now, path, style.body);
        drawSpiderHead(now, path, style);
      }

      const TRAIL_RENDERERS = {
        minimalReveal: {
          drawMask: drawMinimalRevealMask,
          drawOverlay: (now, path, style) => drawMinimalRevealGlow(path, style),
        },
        heroLight: {
          drawMask: drawHeroLightMask,
          drawOverlay: drawHeroLightOverlay,
        },
        gearPi: {
          drawMask: drawGearPiTrailMask,
          drawUnderlay: drawGearPiCloudBorder,
        },
        maskedWeb: {
          drawMask: drawSpiderTrailMask,
          drawOverlay: drawSpiderTrailOverlay,
        },
        radialWeb: {
          drawMask: drawSpiderTrailMask,
          drawOverlay: drawSpiderTrailOverlay,
        },
      };

      function getActiveTrailRenderer(trailDefinition) {
        const renderer = TRAIL_RENDERERS[trailDefinition.renderer];
        if (!renderer) {
          throw new Error(`Unknown trail renderer: ${trailDefinition.renderer}`);
        }
        return renderer;
      }

      function drawActiveTrailMask(now, renderer, trailDefinition) {
        const path = buildTrailPath(now);
        if (!path) return null;
        return renderer.drawMask(now, path, trailDefinition.style);
      }

      function draw(now) {
        if (isPaused || !imagesReady || top.naturalWidth === 0 || bottom.naturalWidth === 0) {
          animFrameId = null;
          return;
        }
        const w = hero.offsetWidth, h = hero.offsetHeight;
        const deltaSeconds = lastFrameTime
          ? Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000))
          : 1 / 60;
        lastFrameTime = now;
        updateTrail(now, deltaSeconds);
        updateLivingMotion(now, deltaSeconds, w, h);

        ctx.clearRect(0, 0, w, h);
        const ct = coverWithLivingMotion(top, w, h);
        ctx.drawImage(top, ct[0], ct[1], ct[2], ct[3]);
        const livingMotion = getLivingMotionConfig();
        if (
          livingMotion?.deformation.enabled &&
          livingMotion.deformation.sourceType === 'layered-cutouts'
        ) {
          drawLivingPuppetRegions(
            ctx,
            top,
            ct,
            livingMotion.deformation.restingRegions,
            livingMotion.deformation.restingProtectedAreas,
            now,
          );
        }
        const dimming = getDimmingAlpha();
        ctx.fillStyle = `rgba(0,0,0,${dimming})`;
        ctx.fillRect(0, 0, w, h);
        drawLivingRestingAtmosphere(ctx, now, w, h);

        offc.clearRect(0, 0, w, h);
        const trailDefinition = getActiveTrailDefinition();
        const renderer = getActiveTrailRenderer(trailDefinition);
        const trailPath = drawActiveTrailMask(now, renderer, trailDefinition);
        offc.globalCompositeOperation = 'source-in';
        const cb = getLivingMotionConfig() ? ct : cover(bottom, w, h);
        offc.drawImage(bottom, cb[0], cb[1], cb[2], cb[3]);
        offc.globalCompositeOperation = 'source-atop';
        if (
          livingMotion?.deformation.enabled &&
          livingMotion.deformation.sourceType === 'layered-cutouts' &&
          trailPath
        ) {
          drawLivingPuppetRegions(
            offc,
            bottom,
            cb,
            livingMotion.deformation.revealedRegions,
            livingMotion.deformation.revealedProtectedAreas,
            now,
          );
        }
        offc.fillStyle = `rgba(0,0,0,${dimming})`;
        offc.fillRect(0, 0, w, h);
        drawLivingRevealedAtmosphere(offc, now, w, h, cb);

        if (renderer.drawUnderlay) {
          renderer.drawUnderlay(now, trailPath, trailDefinition.style);
        }
        ctx.drawImage(off, 0, 0, w, h);
        if (renderer.drawOverlay) {
          renderer.drawOverlay(now, trailPath, trailDefinition.style);
        }
        animFrameId = requestAnimationFrame(draw);
      }

      document.addEventListener('dblclick', () => {
        if (buildPlatform !== 'browser') return;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.log(err));
        } else {
          document.exitFullscreen();
        }
      });
    })();
  </script>
</body>

</html>
